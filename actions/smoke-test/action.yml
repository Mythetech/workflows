name: 'Smoke Test Desktop App'
description: 'Launches a packaged desktop app in Hermes smoke mode and fails unless it reports a passing verdict'

inputs:
  app_name:
    description: 'Application name (e.g., Horizon)'
    required: true
  platform:
    description: 'Platform (Windows, macOS, Linux)'
    required: true
  releases_dir:
    description: 'Directory containing the release artifacts'
    required: true
    default: 'releases'
  timeout:
    description: 'Smoke run budget in seconds, passed to the app as HERMES_SMOKE_TEST_TIMEOUT'
    required: false
    default: '60'
  require_verdict:
    description: 'Fail when the app predates smoke mode instead of falling back to a liveness check'
    required: false
    default: 'false'
  output_dir:
    description: 'Directory for the app log, result JSON, run record and failure screenshot'
    required: false
    default: 'smoke-output'

outputs:
  result:
    description: 'passed or failed'
    value: ${{ steps.verdict.outputs.result }}
  reason:
    description: 'One-line explanation of the verdict'
    value: ${{ steps.verdict.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - name: Install Linux Dependencies
      if: inputs.platform == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0 libwebkit2gtk-4.1-0 xdotool libfuse2 libnotify4 scrot

    - name: Start Virtual Display (Linux)
      if: inputs.platform == 'Linux'
      shell: bash
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2

    - name: Run App in Smoke Mode
      shell: pwsh
      env:
        DISPLAY: ':99'
        SMOKE_APP_NAME: ${{ inputs.app_name }}
        SMOKE_PLATFORM: ${{ inputs.platform }}
        SMOKE_RELEASES_DIR: ${{ inputs.releases_dir }}
        SMOKE_OUTPUT_DIR: ${{ inputs.output_dir }}
        SMOKE_TIMEOUT: ${{ inputs.timeout }}
      run: |
        & (Join-Path $env:GITHUB_ACTION_PATH 'Start-SmokeRun.ps1') `
          -AppName $env:SMOKE_APP_NAME `
          -Platform $env:SMOKE_PLATFORM `
          -ReleasesDir $env:SMOKE_RELEASES_DIR `
          -OutputDir $env:SMOKE_OUTPUT_DIR `
          -TimeoutSeconds ([int]$env:SMOKE_TIMEOUT)

    - name: Decide Verdict
      id: verdict
      if: ${{ !cancelled() }}
      shell: pwsh
      env:
        SMOKE_PLATFORM: ${{ inputs.platform }}
        SMOKE_OUTPUT_DIR: ${{ inputs.output_dir }}
        SMOKE_REQUIRE_VERDICT: ${{ inputs.require_verdict }}
      run: |
        & (Join-Path $env:GITHUB_ACTION_PATH '..' 'smoke-verdict' 'Invoke-SmokeVerdict.ps1') `
          -OutputDir $env:SMOKE_OUTPUT_DIR `
          -RequireVerdict $env:SMOKE_REQUIRE_VERDICT `
          -Platform $env:SMOKE_PLATFORM

    - name: Screenshot on Failure (Windows)
      if: failure() && inputs.platform == 'Windows'
      shell: pwsh
      env:
        SMOKE_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        New-Item -ItemType Directory -Force -Path $env:SMOKE_OUTPUT_DIR | Out-Null
        Add-Type -AssemblyName System.Windows.Forms
        Add-Type -AssemblyName System.Drawing
        $screen = [System.Windows.Forms.Screen]::PrimaryScreen
        $bitmap = New-Object System.Drawing.Bitmap($screen.Bounds.Width, $screen.Bounds.Height)
        $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
        $graphics.CopyFromScreen($screen.Bounds.Location, [System.Drawing.Point]::Empty, $screen.Bounds.Size)
        $bitmap.Save((Join-Path $env:SMOKE_OUTPUT_DIR 'screenshot-failure.png'))

    - name: Screenshot on Failure (macOS)
      if: failure() && inputs.platform == 'macOS'
      shell: bash
      env:
        SMOKE_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        mkdir -p "$SMOKE_OUTPUT_DIR"
        screencapture -x "$SMOKE_OUTPUT_DIR/screenshot-failure.png" || true

    - name: Screenshot on Failure (Linux)
      if: failure() && inputs.platform == 'Linux'
      shell: bash
      env:
        SMOKE_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        mkdir -p "$SMOKE_OUTPUT_DIR"
        DISPLAY=:99 scrot "$SMOKE_OUTPUT_DIR/screenshot-failure.png" || true
